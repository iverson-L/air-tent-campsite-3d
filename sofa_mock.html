<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sofa Mock — inflatable sofa sandbox</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #e8eaed; font-family: system-ui, sans-serif; }
  #app { width: 100%; height: 100%; }
  #hint { position: absolute; top: 12px; left: 12px; z-index: 10; background: rgba(255,255,255,.85);
    border-radius: 8px; padding: 8px 12px; font-size: 12px; color: #444; box-shadow: 0 2px 10px rgba(0,0,0,.15); }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="hint">Sofa mock — inflatable "Spark Air" style sofa (200 × 110 cm, seat 150 × 80). Orbit: drag · zoom: wheel.</div>
<div id="app"></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

// ---------- scene rig (same as block10_mock.html / block05.html) ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.getElementById('app').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xe8eaed);

const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.05, 100);
camera.position.set(-2.0, 1.25, 2.6); // front-left 3/4 like sofa_2.png
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0.05, 0.38, 0);
controls.update();

scene.add(new THREE.HemisphereLight(0xdfe8f2, 0x8f928a, 1.45));
const sun = new THREE.DirectionalLight(0xfff4e0, 1.25);
sun.position.set(8, 12, 6);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -2.5; sun.shadow.camera.right = 2.5;
sun.shadow.camera.top = 2.5; sun.shadow.camera.bottom = -2.5;
// tight depth range: the default 0.5–500 m turns the normalised bias into ~20 cm and shadows lift off the ground
sun.shadow.camera.near = 8; sun.shadow.camera.far = 24;
sun.shadow.bias = -0.0002; sun.shadow.normalBias = 0.01;
scene.add(sun);

// ---------- dimensions (per sofa_1.png) ----------
// x: width (left −, right +), y up, z depth (front +). Origin = centre of the footprint on the ground.
const W = 2.00;          // overall width                 [200 cm]
const D = 1.10;          // overall depth (estimated from sofa_2.png — base ≈ 0.55 × width)
const BASE_H = 0.40;     // base height = seat height     [40 cm]
const SEAT_W = 1.50;     // seat between the arms         [150 cm]
const SEAT_D = 0.80;     // seat depth in front of the backrest [80 cm]
const ARM_H = 0.30;      // arm height above the seat     [30 cm]
const BACK_H = 0.50;     // backrest height above the seat [50 cm]
const ARM_W = (W - SEAT_W) / 2;           // 25 cm
const PAD_T = 0.035;                      // thin seat pad lying on the base (its rolled edge reads as the "piping")
const SEAT_Y = BASE_H;                    // top of the pad
const BACK_T = D - SEAT_D - 0.02;         // backrest thickness ≈ 28 cm
const ARM_SET = 0.07;                     // arms + backrest stop this far in from the base's front/back edge

// ---------- materials: brushed sage-grey PVC fabric (sampled from sofa_1.png: base ≈ #676c6a lit) ----------
function makeBrushedTexture(size = 256) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#e6e8e6';
  ctx.fillRect(0, 0, size, size);
  for (let i = 0; i < 2400; i++) { // fine horizontal brushing streaks
    const v = 200 + Math.floor(Math.random() * 50);
    ctx.fillStyle = `rgba(${v},${v + 2},${v},0.10)`;
    ctx.fillRect(Math.random() * size, Math.random() * size, 4 + Math.random() * 18, 1);
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(3, 3);
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return tex;
}
const brushed = makeBrushedTexture();
const matSofa = new THREE.MeshPhysicalMaterial({ color: 0x9aa7a2, roughness: 0.62, sheen: 0.35, sheenRoughness: 0.6,
  sheenColor: 0xb8c2bd, map: brushed, bumpMap: brushed, bumpScale: 0.25 });
const matPiping = new THREE.MeshStandardMaterial({ color: 0x50585a, roughness: 0.55 });       // seams / zip binding
const matBlack = new THREE.MeshStandardMaterial({ color: 0x18191a, roughness: 0.7 });          // velcro, strap, pump box
const matBlackHard = new THREE.MeshStandardMaterial({ color: 0x232426, roughness: 0.45, metalness: 0.1 });

// ---------- helpers ----------
// Inflated "pillow" bulge for a box of half-sizes (hx, hy, hz): each face bows outward, peaking at its centre
// (amt) and fading to 0 at its edges — the same function shapes decals so they sit exactly on the surface.
const pillow = (u, v) => Math.max(0, 1 - u * u) * Math.max(0, 1 - v * v);
function inflatedBox(w, h, d, r, amt, seg = 6) {
  const geo = new RoundedBoxGeometry(w, h, d, seg, r);
  const p = geo.attributes.position, n = geo.attributes.normal;
  const hx = w / 2, hy = h / 2, hz = d / 2;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), y = p.getY(i), z = p.getZ(i), ax = Math.abs(n.getX(i)), ay = Math.abs(n.getY(i)), az = Math.abs(n.getZ(i));
    let b; // bulge for the face this vertex mostly belongs to
    if (ax >= ay && ax >= az) b = pillow(y / hy, z / hz);
    else if (ay >= az) b = pillow(x / hx, z / hz);
    else b = pillow(x / hx, y / hy);
    const k = amt * b;
    p.setXYZ(i, x + n.getX(i) * k, y + n.getY(i) * k, z + n.getZ(i) * k);
  }
  geo.computeVertexNormals();
  return geo;
}
// closed rounded-rectangle loop (x–z plane) at height y — for seams/piping
function rrLoopPts(hx, hz, r, y, seg = 8) {
  const pts = [], corners = [[hx - r, hz - r, 0], [-(hx - r), hz - r, 0.5], [-(hx - r), -(hz - r), 1], [hx - r, -(hz - r), 1.5]];
  for (const [cx, cz, a0] of corners) for (let k = 0; k <= seg; k++) {
    const a = Math.PI * (a0 + 0.5 * k / seg);
    pts.push(new THREE.Vector3(cx + Math.cos(a) * r, y, cz + Math.sin(a) * r));
  }
  pts.push(pts[0].clone());
  return pts;
}
function tube(pts, r, mat, closed = false) {
  const curve = new THREE.CatmullRomCurve3(pts, closed, 'catmullrom', 0.0);
  return new THREE.Mesh(new THREE.TubeGeometry(curve, pts.length * 4, r, 8, closed), mat);
}
// a canvas-texture decal on a face of an inflated box, curved to the same pillow bulge so it never floats
function faceDecal(draw, cw, ch, faceW, faceH, hx, hy, amt, at) {
  const c = document.createElement('canvas');
  c.width = cw; c.height = ch;
  draw(c.getContext('2d'), cw, ch);
  const tex = new THREE.CanvasTexture(c);
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  const geo = new THREE.PlaneGeometry(faceW, faceH, 24, 8);
  const p = geo.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i) + at.x, y = p.getY(i) + at.y;          // position within the face (centred coords)
    p.setZ(i, amt * pillow(x / hx, y / hy) + 0.0015);
  }
  geo.translate(at.x, at.y, 0);
  return new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ map: tex, transparent: true, roughness: 0.6, depthWrite: false,
    polygonOffset: true, polygonOffsetFactor: -2 }));
}
const textCol = '#1c1f1e'; // near-black charcoal print, as in the photos

// ---------- build ----------
function buildSofa() {
  const g = new THREE.Group();

  // base: big inflated block, 200 × 110 × 37 cm, soft rounded edges
  const BASE_BODY_H = BASE_H - PAD_T, B_AMT = 0.012;
  const base = new THREE.Mesh(inflatedBox(W, BASE_BODY_H, D, 0.07, B_AMT), matSofa);
  base.position.y = BASE_BODY_H / 2;
  base.castShadow = base.receiveShadow = true;
  g.add(base);
  // seat pad: thin cushion lying on the base, slightly inset, with a rolled edge (the piping line in the photos)
  const pad = new THREE.Mesh(inflatedBox(W - 0.07, PAD_T + 0.014, D - 0.07, 0.025, 0.004, 4), matSofa); // inside the base's 7 cm round
  pad.position.y = BASE_BODY_H + PAD_T / 2 - 0.004;
  pad.castShadow = pad.receiveShadow = true;
  g.add(pad);
  g.add(tube(rrLoopPts(W / 2 - 0.036, D / 2 - 0.036, 0.03, BASE_BODY_H + 0.004), 0.005, matPiping)); // seam where the pad meets the base
  g.add(tube(rrLoopPts(W / 2 - 0.03, D / 2 - 0.03, 0.06, 0.012), 0.005, matPiping));                // bottom seam

  // backrest: between the arms, at the back, with a top bolster seam
  const BACK_Z = -D / 2 + ARM_SET / 2 + BACK_T / 2, BK_AMT = 0.014;
  const back = new THREE.Mesh(inflatedBox(SEAT_W + 0.02, BACK_H, BACK_T, 0.06, BK_AMT), matSofa);
  back.position.set(0, SEAT_Y + BACK_H / 2, BACK_Z);
  back.castShadow = back.receiveShadow = true;
  g.add(back);
  { // bolster seam across the front + top edge
    const y = SEAT_Y + BACK_H - 0.11, zf = BACK_Z + BACK_T / 2 + BK_AMT * 0.55;
    g.add(tube([new THREE.Vector3(-SEAT_W / 2 + 0.03, y, zf), new THREE.Vector3(SEAT_W / 2 - 0.03, y, zf)], 0.004, matPiping));
  }

  // arms: 25 cm wide, 30 cm above the seat, from the back to just short of the front
  const ARM_D = D - 2 * ARM_SET + 0.04, ARM_Z = -0.02 + 0.0, A_AMT = 0.012;
  for (const s of [-1, 1]) {
    const arm = new THREE.Mesh(inflatedBox(ARM_W, ARM_H + 0.02, ARM_D, 0.06, A_AMT), matSofa);
    arm.position.set(s * (W / 2 - ARM_W / 2), SEAT_Y + ARM_H / 2, ARM_Z);
    arm.castShadow = arm.receiveShadow = true;
    g.add(arm);
  }

  // pockets: on each arm's front face and outer side face — soft fabric pouch, dark zip binding, black velcro patch
  const armFrontZ = ARM_Z + ARM_D / 2 + A_AMT * 0.6, armOuterX = W / 2 + A_AMT * 0.6;
  function pocket(w, h, centre, rotY) {
    const grp = new THREE.Group();
    const pouch = new THREE.Mesh(inflatedBox(w, h, 0.045, 0.012, 0.008, 3), matSofa);
    pouch.position.z = 0.022;
    pouch.castShadow = pouch.receiveShadow = true;
    grp.add(pouch);
    // Everything on the pouch front is DRAPED onto its real (bulged, rounded) surface by raycasting, so lines and
    // the velcro patch follow the curve instead of floating off it (straight tubes floated at the ends — per user).
    pouch.updateMatrixWorld(true);
    const ray = new THREE.Raycaster();
    const surfZ = (x, y) => { ray.set(new THREE.Vector3(x, y, 1), new THREE.Vector3(0, 0, -1));
      const hit = ray.intersectObject(pouch, false)[0]; return hit ? hit.point.z : null; };
    const drape = (x0, y0, x1, y1, r, n = 24) => { // binding half-sunk into the fabric (centre r·0.3 proud)
      const pts = [];
      for (let k = 0; k <= n; k++) { const x = x0 + (x1 - x0) * k / n, y = y0 + (y1 - y0) * k / n, z = surfZ(x, y);
        if (z !== null) pts.push(new THREE.Vector3(x, y, z + r * 0.3)); }
      return tube(pts, r, matPiping);
    };
    const hw = w / 2 - 0.016, hh = h / 2 - 0.016; // binding runs just inside the pouch's 12 mm rounded edge
    grp.add(drape(-hw, hh, hw, hh, 0.0035));                       // zip along the top
    grp.add(drape(-hw, hh - 0.035, hw, hh - 0.035, 0.0025));       // flap edge
    for (const sx of [-1, 1]) grp.add(drape(sx * hw, hh, sx * hw, -hh, 0.0035)); // zipped sides
    // velcro patch: thin plane draped on the surface (1 mm proud)
    const vw = w * 0.42, vh = h * 0.42, vx = w * 0.06, vy = -h * 0.12;
    const vGeo = new THREE.PlaneGeometry(vw, vh, 8, 8), vp = vGeo.attributes.position;
    for (let i = 0; i < vp.count; i++) { const x = vp.getX(i) + vx, y = vp.getY(i) + vy; vp.setXYZ(i, x, y, (surfZ(x, y) ?? 0.05) + 0.001); }
    vGeo.computeVertexNormals();
    grp.add(new THREE.Mesh(vGeo, matBlack));
    grp.position.copy(centre);
    grp.rotation.y = rotY;
    return grp;
  }
  const pocketY = SEAT_Y + ARM_H * 0.45;
  for (const s of [-1, 1]) {
    g.add(pocket(0.19, 0.20, new THREE.Vector3(s * (W / 2 - ARM_W / 2), pocketY, armFrontZ - 0.005), 0));                // front face
    g.add(pocket(0.24, 0.20, new THREE.Vector3(s * (armOuterX - 0.005), pocketY, ARM_Z + ARM_D / 2 - 0.20), s * Math.PI / 2)); // outer side
  }

  // built-in pump / power box: rugged black block on the left arm's outer side, toward the back (sofa_2.png)
  {
    const box = new THREE.Group();
    const body = new THREE.Mesh(new RoundedBoxGeometry(0.075, 0.15, 0.17, 3, 0.012), matBlackHard);
    box.add(body);
    for (let k = -2; k <= 2; k++) { // ribbed grip bars
      const rib = new THREE.Mesh(new THREE.BoxGeometry(0.012, 0.016, 0.15), matBlack);
      rib.position.set(-0.04, k * 0.028, 0);
      box.add(rib);
    }
    const screen = new THREE.Mesh(new THREE.PlaneGeometry(0.035, 0.02), new THREE.MeshStandardMaterial({ color: 0x0a0a0a, emissive: 0x0e1a12, roughness: 0.2 }));
    screen.position.set(0, 0.076, 0.03); screen.rotation.x = -Math.PI / 2;
    box.add(screen);
    box.position.set(-(armOuterX + 0.035), SEAT_Y + ARM_H * 0.55, ARM_Z - ARM_D / 2 + 0.16);
    box.traverse(o => { if (o.isMesh) o.castShadow = o.receiveShadow = true; });
    g.add(box);
  }

  // carry strap: black webbing loop on the left end of the base (sofa_2.png)
  {
    const strap = new THREE.Mesh(new THREE.BoxGeometry(0.008, 0.025, 0.12), matBlack);
    strap.position.set(-(W / 2 + B_AMT * 0.95 + 0.002), BASE_BODY_H * 0.62, 0.18);
    g.add(strap);
  }

  // ---- printed graphics ----
  // "SPARK AIR" on the backrest front, centred under the bolster seam
  {
    const bhx = (SEAT_W + 0.02) / 2, bhy = BACK_H / 2;
    const d = faceDecal((ctx, cw, ch) => {
      ctx.fillStyle = textCol;
      ctx.font = '900 150px "Arial Black", Impact, sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.save(); ctx.scale(1, 1.15); ctx.fillText('SPARK AIR', cw / 2, ch / 2 / 1.15); ctx.restore();
    }, 1024, 220, 0.46, 0.099, bhx, bhy, BK_AMT, { x: 0, y: BACK_H / 2 - 0.175 });
    d.position.set(0, SEAT_Y + BACK_H / 2, BACK_Z + BACK_T / 2);
    g.add(d);
  }
  // base front: "01 AIR" badge (right) + "The modular brushed sofa" tagline (left-centre)
  {
    const hx = W / 2, hy = BASE_BODY_H / 2;
    const badge = faceDecal((ctx, cw, ch) => {
      ctx.strokeStyle = textCol; ctx.fillStyle = textCol; ctx.lineWidth = 10; ctx.lineJoin = 'round';
      ctx.font = '900 300px "Arial Black", Impact, sans-serif';
      ctx.textBaseline = 'alphabetic';
      ctx.strokeText('01', 10, 300);                                   // outlined stencil digits
      ctx.font = '900 110px "Arial Black", Impact, sans-serif';
      ctx.fillText('AIR', 420, 150);
      for (let k = 0; k < 6; k++) ctx.fillRect(420 + k * 34, 180, 20, 120 - k * 14); // hatch bars
      ctx.font = 'italic 600 46px Arial, sans-serif';
      ctx.fillText('1500-850-400 MM', 60, 370);
    }, 700, 400, 0.36, 0.206, hx, hy, B_AMT, { x: 0.53, y: 0.02 });
    badge.position.set(0, BASE_BODY_H / 2, D / 2);
    g.add(badge);
    const tag = faceDecal((ctx, cw, ch) => {
      ctx.fillStyle = textCol; ctx.textBaseline = 'alphabetic';
      ctx.font = '600 58px Arial, sans-serif';
      ctx.fillText('The modular brushed sofa', 4, 70);
      ctx.font = '500 30px Arial, sans-serif';
      ctx.fillText('Makes the camping experience', 4, 130);
      ctx.fillText('as comfortable as home.', 4, 168);
    }, 760, 190, 0.34, 0.085, hx, hy, B_AMT, { x: -0.38, y: -0.035 });
    tag.position.set(0, BASE_BODY_H / 2, D / 2);
    g.add(tag);
  }

  return g;
}

// ---------- grounding (no visible ground surface, like the tent mocks) ----------
const shadowCatcher = new THREE.Mesh(new THREE.PlaneGeometry(20, 20), new THREE.ShadowMaterial({ opacity: 0.18 }));
shadowCatcher.rotation.x = -Math.PI / 2;
shadowCatcher.receiveShadow = true;
scene.add(shadowCatcher);
{
  const c = document.createElement('canvas');
  c.width = c.height = 256;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, 256, 256); // alphaMap reads GREEN: black = clear
  ctx.filter = 'blur(16px)';
  ctx.fillStyle = 'rgb(150,150,150)';
  ctx.fillRect(36, 44, 184, 168);
  const blob = new THREE.Mesh(new THREE.PlaneGeometry(W * 1.25, D * 1.45),
    new THREE.MeshBasicMaterial({ color: 0x000000, alphaMap: new THREE.CanvasTexture(c), transparent: true, depthWrite: false }));
  blob.rotation.x = -Math.PI / 2;
  blob.position.y = 0.001;
  scene.add(blob);
}

scene.add(buildSofa());

// debug handles (for MCP / console testing)
window.__scene = scene;
window.__camera = camera;
window.__controls = controls;
window.__renderer = renderer;

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
