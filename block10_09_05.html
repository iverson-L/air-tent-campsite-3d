<script type="module">
// GENERATED by build_combos.py from block10_mock.html, block09_mock.html, block05.html, sofa_mock.html. Do not edit by hand — edit the source model and re-run.
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

// ---------- scene rig (same as the single-model mocks) ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.getElementById('app').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xe8eaed);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 200);
camera.position.set(-4.2, 3.4, 7.2);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0.8, 0.9, -1.2);
controls.update();

scene.add(new THREE.HemisphereLight(0xdfe8f2, 0x8f928a, 1.45));
const sun = new THREE.DirectionalLight(0xfff4e0, 1.25);
sun.position.set(8, 12, 6);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);                 // bigger area than a single tent → more texels
sun.shadow.camera.left = -7; sun.shadow.camera.right = 7;
sun.shadow.camera.top = 7; sun.shadow.camera.bottom = -7;
// tight depth range (the default 0.5–500 m makes the bias ~20 cm and light leaks under the wall bases)
sun.shadow.camera.near = 8; sun.shadow.camera.far = 24;
sun.shadow.bias = -0.0002; sun.shadow.normalBias = 0.01;
scene.add(sun);

const makeBlock10 = (() => {
  // ---------- Block 10 dimensions (official) ----------
  const W = 3.6;           // gable face span (x, across the gap) — roof slopes face ±x [360 cm]
  const D = 2.8;           // tent length (front-to-back) — ridge runs along this axis [280 cm]
  const WALL_H = 1.70;     // wall height                       [170 cm]
  const RIDGE_H = 2.45;    // tent roof ridge                   [245 cm]
  // silhouette rounding = tangent length along each edge (the quadratic-bezier fillets are built from it)
  // Side-wall LEAN (per user): the long side walls tilt inward so the roof is narrower than the
  // 360 cm base; the 280 cm gable ends stay vertical. 11° is the perspective-corrected lean measured
  // from the YAMATO10 reference photo (pillar edges ≈ 11.3° with the gable face upright).
  const LEAN_DEG = 11;
  const LEAN_RAD = LEAN_DEG * Math.PI / 180, LEAN = Math.tan(LEAN_RAD); // horizontal inset per metre of height
  const EAVE_X = W / 2 - WALL_H * LEAN;  // eave vertex half-width (≈1.47 m → ≈2.94 m across at the eave)
  // Ridge and eave are specified as TRUE radii. For a symmetric quadratic bezier with tangent length t
  // and half-turn θ, the apex radius is t·cos²θ / sinθ, so solve for t.
  //   ridge: spec 16 cm diameter → 0.08 m; half-turn = roof pitch
  //   eave:  0.12 m (was ≈0.32 m — too round, per user); half-turn = (90° − pitch − lean) / 2
  const RIDGE_RADIUS = 0.08, EAVE_RADIUS = 0.12;
  const ROOF_PITCH = Math.atan2(RIDGE_H - WALL_H, EAVE_X);
  const EAVE_HALF_TURN = (Math.PI / 2 - ROOF_PITCH - LEAN_RAD) / 2;
  const bezTangent = (r, th) => r * Math.sin(th) / Math.cos(th) ** 2;
  const R_EAVE = bezTangent(EAVE_RADIUS, EAVE_HALF_TURN);
  const R_RIDGE = bezTangent(RIDGE_RADIUS, ROOF_PITCH);
  // rake edge (roof → gable wall) and the gable's vertical corners: rounded with this TRUE radius at
  // both ends (per user, 12 cm). The flat gable panels sit inside it.
  const RAKE_R = 0.12;
  const DOOR_SILL = 0.16;    // fabric sill under the gable mesh

  // ---------- procedural TC cotton texture (near-white base so tinting works) ----------
  function makeCottonTexture(size = 512) {
    const c = document.createElement('canvas');
    c.width = c.height = size;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#eceae6'; // near-white base — material colour tints it
    ctx.fillRect(0, 0, size, size);
    // tight plain-weave threads (very low contrast — cotton reads as smooth)
    for (let y = 0; y < size; y += 2) {
      for (let x = 0; x < size; x += 2) {
        const on = (((x / 2) + (y / 2)) % 2) === 0;
        ctx.fillStyle = on ? 'rgba(255,255,255,0.30)' : 'rgba(140,138,132,0.16)';
        ctx.fillRect(x, y, 1, 1);
      }
    }
    // faint ripstop reinforcement grid (~3.5 cm on a 0.5 m tile)
    ctx.strokeStyle = 'rgba(120,118,112,0.14)';
    ctx.lineWidth = 1;
    for (let p = 0; p <= size; p += 36) {
      ctx.beginPath(); ctx.moveTo(p + 0.5, 0); ctx.lineTo(p + 0.5, size); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, p + 0.5); ctx.lineTo(size, p + 0.5); ctx.stroke();
    }
    // soft fibre noise (sparse — cotton is clean)
    for (let i = 0; i < 1600; i++) {
      const v = 200 + Math.floor(Math.random() * 55);
      ctx.fillStyle = `rgba(${v},${v},${v - 4},0.12)`;
      ctx.fillRect(Math.random() * size, Math.random() * size, 1, 1);
    }
    const tex = new THREE.CanvasTexture(c);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
    return tex;
  }
  // extrude UVs are in metres → repeat 2 = 0.5 m tile (cotton weave scale)
  const tentFabricTex = makeCottonTexture();
  tentFabricTex.repeat.set(2, 2);

  // palette: dark grey TC fabric (per user — the warm cast in image3.png is the evening light, not
  // the fabric). EVERY exterior fabric panel — roof, walls, gable panels, flaps, skirt — shares ONE
  // material instance so they are the same colour by construction (per user); only lighting varies
  // them. The cotton texture doubles as a bump map so the weave catches light instead of reading as
  // flat plastic. Zips and straps get a separate darker trim so they stay visible.
  const fabric = (color, extra = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.93, side: THREE.DoubleSide,
    map: tentFabricTex, bumpMap: tentFabricTex, bumpScale: 0.6, ...extra });
  const matCanvas    = fabric(0x55585d); // the tent fabric — used for every exterior panel
  const matRoof      = matCanvas;        // alias kept for readability at the roof call site — SAME instance
  const matTrim      = new THREE.MeshStandardMaterial({ color: 0x2c2e32, roughness: 0.8 }); // zip tape, webbing straps
  // bathtub floor: 500D PVC tarpaulin (per user) — light grey, smooth coated sheet with a soft satin
  // sheen (clearcoat), not the matte woven look of the tent fabric
  const matTentFloor = new THREE.MeshPhysicalMaterial({ color: 0xb4b7bb, roughness: 0.55, clearcoat: 0.3, clearcoatRoughness: 0.45, side: THREE.DoubleSide });
  const BAT_H = 0.10; // bathtub side-wall height (10 cm, per user)
  // per image3.png: the gable door and the long-side windows are a FINE MESH SCREEN you can see through
  // alphaMap uses the GREEN channel: gaps nearly open, threads semi-opaque → reads as insect mesh.
  // Real tents use the SAME fine screen on every face (per image3) — the side just looks darker
  // in photos because of sun angle. So both get a screen texture; the side's is denser/darker.
  function makeScreenTexture(size = 512, gapG = 26, threadG = 190) {
    const c = document.createElement('canvas');
    c.width = c.height = size;
    const ctx = c.getContext('2d');
    ctx.fillStyle = `rgb(0,${gapG},0)`;     // gap opacity
    ctx.fillRect(0, 0, size, size);
    const pitch = size / 21;                 // 21 cells/tile ≈ +30% density (was 16) — seamless wrap
    ctx.strokeStyle = `rgb(0,${threadG},0)`; // thread opacity
    ctx.lineWidth = 2;
    for (let p = 0; p <= size; p += pitch) {
      ctx.beginPath(); ctx.moveTo(p + 0.5, 0); ctx.lineTo(p + 0.5, size); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, p + 0.5); ctx.lineTo(size, p + 0.5); ctx.stroke();
    }
    const tex = new THREE.CanvasTexture(c);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    tex.repeat.set(2, 2); // ShapeGeometry UVs are in metres → 2 tiles/m
    return tex;
  }
  const matGableMesh = new THREE.MeshStandardMaterial({ color: 0x17181b, roughness: 0.95, transparent: true, alphaMap: makeScreenTexture(512, 26, 190), side: THREE.DoubleSide, depthWrite: false }); // bright fine screen — interior clearly visible
  // Fine mesh blocks roughly half of direct sun. three.js shadows are all-or-nothing, so screens cast
  // through this checkerboard depth material: every other shadow-map texel is discarded and the PCF
  // soft-shadow filter averages that to a ~50% shadow — otherwise sun pours straight through the
  // screens and lights the inside of the back wall as if the fabric were transparent.
  const matScreenShadow = new THREE.MeshDepthMaterial({ depthPacking: THREE.RGBADepthPacking });
  matScreenShadow.onBeforeCompile = sh => {
    sh.fragmentShader = sh.fragmentShader.replace('void main() {',
      'void main() {\n  if (mod(floor(gl_FragCoord.x) + floor(gl_FragCoord.y), 2.0) < 0.5) discard;');
  };
  const matMetal     = new THREE.MeshStandardMaterial({ color: 0x2a2b2e, roughness: 0.6, metalness: 0.5 });
  // interior ridge pillar — light grey structural spine along the apex
  const matPole = new THREE.MeshStandardMaterial({ color: 0xbfc3c7, roughness: 0.55, metalness: 0.15 });

  // ---------- shape helpers (copied from index.html) ----------
  // rounded rectangle with DIFFERENT top / bottom corner radii (Block 09 windows: rounder bottom corners)
  function roundedRectShape2(w, h, rTop, rBot) {
    const s = new THREE.Shape();
    const x = -w / 2, y = -h / 2;
    s.moveTo(x + rBot, y);
    s.lineTo(x + w - rBot, y);
    s.quadraticCurveTo(x + w, y, x + w, y + rBot);
    s.lineTo(x + w, y + h - rTop);
    s.quadraticCurveTo(x + w, y + h, x + w - rTop, y + h);
    s.lineTo(x + rTop, y + h);
    s.quadraticCurveTo(x, y + h, x, y + h - rTop);
    s.lineTo(x, y + rBot);
    s.quadraticCurveTo(x, y, x + rBot, y);
    return s;
  }
  function roundedRectShape(w, h, r) {
    const s = new THREE.Shape();
    const x = -w / 2, y = -h / 2;
    s.moveTo(x + r, y);
    s.lineTo(x + w - r, y);
    s.quadraticCurveTo(x + w, y, x + w, y + r);
    s.lineTo(x + w, y + h - r);
    s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    s.lineTo(x + r, y + h);
    s.quadraticCurveTo(x, y + h, x, y + h - r);
    s.lineTo(x, y + r);
    s.quadraticCurveTo(x, y, x + r, y);
    return s;
  }

  // Round the two bottom corners of a door opening built by archPts (open path right foot → … → left foot, closed
  // along the sill): each foot becomes a quadratic fillet of radius ≈ r between the sill and the leaning side (per
  // user: entrance bottom corners use the same 16 cm radius as the windows).
  function filletFeet(pts, r) {
    const V = (x, y) => new THREE.Vector2(x, y), n = pts.length;
    const q = (a, c, b, out, seg = 10) => { for (let k = 1; k <= seg; k++) { const t = k / seg, u = 1 - t;
      out.push(V(u * u * a.x + 2 * u * t * c.x + t * t * b.x, u * u * a.y + 2 * u * t * c.y + t * t * b.y)); } };
    const FR = pts[0], FL = pts[n - 1];
    const AR = V(FR.x - r, FR.y), BR = FR.clone().addScaledVector(pts[1].clone().sub(FR).normalize(), r);
    const AL = V(FL.x + r, FL.y), BL = FL.clone().addScaledVector(pts[n - 2].clone().sub(FL).normalize(), r);
    const out = [AR]; q(AR, FR, BR, out);
    out.push(...pts.slice(1, -1), BL); q(BL, FL, AL, out);
    return out;
  }

  // Open arch path: the tent silhouette (leaning walls) offset INWARD — the roof lines by `b` and the
  // walls by `bSide` (default b), each along its own normal, so borders are true perpendicular widths.
  // Runs from the right foot (y = yFoot, on the offset wall line) over the ridge to the left foot.
  // Used for the rounded body sections, gable panels, the door opening and the rolled door flap, so all
  // stay concentric with the shell. `minR` (true radius) keeps each fillet at least that round — a tube
  // swept along a path must not bend tighter than its own radius or it pinches at the tight ridge.
  function archPts(b, yFoot = 0, seg = 12, minR = 0, bSide = b) {
    const V = (x, y) => new THREE.Vector2(x, y);
    const wd = V(EAVE_X - W / 2, WALL_H).normalize();      // right wall direction, foot → eave
    const wn = V(wd.y, -wd.x);                             // its outward normal
    const rd = V(-EAVE_X, RIDGE_H - WALL_H).normalize();   // right roof direction, eave → ridge
    const rn = V(rd.y, -rd.x);                             // its outward normal
    const cw = wn.x * (W / 2) - bSide;                     // offset wall line: wn·p = cw
    const cr = rn.x * EAVE_X + rn.y * WALL_H - b;          // offset roof line: rn·p = cr
    const det = wn.x * rn.y - wn.y * rn.x;
    const E = V((cw * rn.y - wn.y * cr) / det, (wn.x * cr - cw * rn.x) / det); // offset eave vertex
    const R = V(0, cr / rn.y);                                                  // offset ridge vertex
    const tE = Math.max(bezTangent(Math.max(EAVE_RADIUS - b, minR), EAVE_HALF_TURN), 0.02);
    const tR = Math.max(bezTangent(Math.max(RIDGE_RADIUS - b, minR), ROOF_PITCH), 0.02);
    const eS = E.clone().addScaledVector(wd, -tE), eX = E.clone().addScaledVector(rd, tE);
    const rS = R.clone().addScaledVector(rd, -tR), rX = V(-rS.x, rS.y);
    const bez = (p0, c, p1, out) => { for (let k = 1; k <= seg; k++) { const t = k / seg, u = 1 - t;
      out.push(V(u*u*p0.x + 2*u*t*c.x + t*t*p1.x, u*u*p0.y + 2*u*t*c.y + t*t*p1.y)); } };
    const right = [];
    if (yFoot < eS.y - 1e-3) right.push(V((cw - wn.y * yFoot) / wn.x, yFoot)); // foot on the offset wall line
    right.push(eS);
    bez(eS, E, eX, right);                                 // right eave
    right.push(rS);
    const pts = [...right];
    bez(rS, R, rX, pts);                                   // ridge (ends at the mirrored rS)
    const left = right.map(p => V(-p.x, p.y)).reverse();   // mirrored right half, top → foot
    pts.push(...left.slice(1));                            // skip mirrored rS (already the ridge's end)
    return pts;
  }

  // Tube swept along a polyline (Vector3[]) — rolled-up fabric. `gather` > 0 ripples
  // the radius along the length so rolled flaps read as bunched fabric rather than a clean pipe.
  // `taper` (m) shrinks the radius over that length at each end so the tube closes off into whatever
  // it's attached to instead of ending as an open pipe. Pass [start, end] to taper the ends differently
  // (0 = leave that end full, e.g. a pillar standing on the floor).
  function makeTube(pts, r, gather = 0, radial = 20, taper = 0) {
    const path = new THREE.CurvePath();
    for (let i = 1; i < pts.length; i++) path.add(new THREE.LineCurve3(pts[i - 1], pts[i]));
    const L = path.getLength(), tubular = Math.max(8, Math.ceil(L / 0.02));
    const geo = new THREE.TubeGeometry(path, tubular, r, radial, false);
    const [tStart, tEnd] = Array.isArray(taper) ? taper : [taper, taper];
    if (tStart > 0 || tEnd > 0) {
      const p = geo.attributes.position, nr = geo.attributes.normal;
      for (let i = 0; i < p.count; i++) {
        const ring = Math.floor(i / (radial + 1));
        const d0 = ring / tubular * L, d1 = (tubular - ring) / tubular * L; // m from start / end
        const t = Math.min(tStart > 0 ? d0 / tStart : 1, tEnd > 0 ? d1 / tEnd : 1, 1);
        const f = 0.12 + 0.88 * t * t * (3 - 2 * t); // smoothstep, never fully 0
        const k = r * (f - 1);
        p.setXYZ(i, p.getX(i) + nr.getX(i) * k, p.getY(i) + nr.getY(i) * k, p.getZ(i) + nr.getZ(i) * k);
      }
    }
    if (gather > 0) {
      const p = geo.attributes.position, nr = geo.attributes.normal;
      for (let i = 0; i < p.count; i++) {
        // ring index along the tube, and position around it. Incommensurate frequencies + a
        // circumferential term → irregular folds, not an evenly scalloped pipe
        const s = Math.floor(i / (radial + 1)), a = (i % (radial + 1)) / radial * Math.PI * 2;
        const k = gather * r * (0.5 * Math.sin(s * 0.53 + 0.8 * Math.sin(s * 0.13)) +
                                0.3 * Math.sin(s * 1.37 + a * 2 + 0.6) + 0.2 * Math.sin(s * 0.29 + a));
        p.setXYZ(i, p.getX(i) + nr.getX(i) * k, p.getY(i) + nr.getY(i) * k, p.getZ(i) + nr.getZ(i) * k);
      }
    }
    return geo;
  }

  // Plan-view footprint loop: rounded rectangle (half-sizes hx × hz, corner r) sampled at n points of
  // uniform arc length u, each pushed out along its outward normal by off(u) at height y(u). Loops
  // built with the same hx/hz/r/n correspond vertex-for-vertex, so loftLoops can stitch them.
  // off(u, nx, nz) also gets the outward plan normal, so leaning (±x) sides can be offset differently.
  function footprintLoop(hx, hz, r, n, off, y) {
    const lx = 2 * (hx - r), lz = 2 * (hz - r), arc = Math.PI * r / 2;
    const segs = [ // walk: right edge → front-right corner → front edge → … (x, z plane)
      { len: lz, at: t => [hx, -(hz - r) + t * lz, 1, 0] },
      { len: arc, at: t => { const a = t * Math.PI / 2; return [hx - r + r * Math.cos(a), hz - r + r * Math.sin(a), Math.cos(a), Math.sin(a)]; } },
      { len: lx, at: t => [hx - r - t * lx, hz, 0, 1] },
      { len: arc, at: t => { const a = Math.PI / 2 + t * Math.PI / 2; return [-(hx - r) + r * Math.cos(a), hz - r + r * Math.sin(a), Math.cos(a), Math.sin(a)]; } },
      { len: lz, at: t => [-hx, hz - r - t * lz, -1, 0] },
      { len: arc, at: t => { const a = Math.PI + t * Math.PI / 2; return [-(hx - r) + r * Math.cos(a), -(hz - r) + r * Math.sin(a), Math.cos(a), Math.sin(a)]; } },
      { len: lx, at: t => [-(hx - r) + t * lx, -hz, 0, -1] },
      { len: arc, at: t => { const a = 1.5 * Math.PI + t * Math.PI / 2; return [hx - r + r * Math.cos(a), -(hz - r) + r * Math.sin(a), Math.cos(a), Math.sin(a)]; } },
    ];
    const per = segs.reduce((a, sg) => a + sg.len, 0);
    const pts = [];
    for (let i = 0; i < n; i++) {
      let u = per * i / n, k = 0;
      const u0 = u;
      while (u > segs[k].len && k < segs.length - 1) { u -= segs[k].len; k++; }
      const [x, z, nx, nz] = segs[k].at(Math.min(u / segs[k].len, 1));
      const o = off(u0, nx, nz);
      pts.push(new THREE.Vector3(x + nx * o, y(u0), z + nz * o));
    }
    return pts;
  }

  // Stitch consecutive loops (same point count) into one closed strip surface.
  function loftLoops(loops) {
    const pos = [], uv = [], idx = [];
    const n = loops[0].length;
    let v = 0;
    loops.forEach((L, j) => {
      if (j > 0) v += L[0].distanceTo(loops[j - 1][0]);
      let u = 0;
      for (let i = 0; i <= n; i++) { // repeat first point → closed seam with continuous UVs
        const p = L[i % n];
        if (i > 0) u += p.distanceTo(L[i - 1]);
        pos.push(p.x, p.y, p.z); uv.push(u, v);
      }
    });
    for (let j = 0; j < loops.length - 1; j++) for (let i = 0; i < n; i++) {
      const a = j * (n + 1) + i, b = a + n + 1;
      idx.push(a, b, a + 1, a + 1, b, b + 1);
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    geo.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
    geo.setIndex(idx);
    geo.computeVertexNormals();
    return geo;
  }

  // GENERATED: remove a mesh's triangles whose centroid (x, z) satisfies drop(cx, cz) — used to take the snow skirt
  // away where two tents meet, so it doesn't show inside through the joint / mesh / doorway
  function cutTris(mesh, drop) {
    const g0 = mesh.geometry, p = g0.attributes.position;
    const idx = g0.index ? Array.from(g0.index.array) : [...Array(p.count).keys()];
    const keep = [];
    for (let i = 0; i < idx.length; i += 3) {
      let cx = 0, cz = 0;
      for (let k = 0; k < 3; k++) { cx += p.getX(idx[i + k]) / 3; cz += p.getZ(idx[i + k]) / 3; }
      if (!drop(cx, cz)) keep.push(idx[i], idx[i + 1], idx[i + 2]);
    }
    g0.setIndex(keep);
  }

  let OPTS = {}; // GENERATED: per-instance build options (set by the returned builder)
  // ---------- tent builder (Block 10) — copied verbatim from index.html ----------
  function buildTent(cx, side) {
    const g = new THREE.Group();
    const hw = W / 2, hd = D / 2;

    // Tent body with ROUNDED END EDGES (rake + gable corners, radius RAKE_R, per user). Lofted through
    // z-stations: each station's cross-section is the silhouette offset inward by the fillet depth at
    // that z (a quarter circle over the last RAKE_R at each end), via archPts' true offset so the tight
    // eave/ridge fillets never fold over. Open at the bottom and at both ends.
    function roundedBodyTube() {
      const base = archPts(0);
      const counts = []; // subdivisions per arch segment, fixed from the un-offset arch → same count every station
      for (let i = 1; i < base.length; i++) counts.push(Math.max(1, Math.ceil(base[i].distanceTo(base[i - 1]) / 0.1)));
      const section = o => {
        const a = archPts(o), out = [a[0]];
        for (let i = 1; i < a.length; i++) for (let k = 1; k <= counts[i - 1]; k++) out.push(a[i - 1].clone().lerp(a[i], k / counts[i - 1]));
        return out;
      };
      // stations [z, inset]. Fillet: α = 0 → inset 0 at RAKE_R from the end; α = 90° → inset RAKE_R at the end
      const M = 10, mid = hd - RAKE_R, fil = al => [RAKE_R - RAKE_R * Math.sin(al), RAKE_R - RAKE_R * Math.cos(al)]; // [e, inset]
      const stations = [];
      for (let k = 0; k < M; k++) { const [e, o] = fil(Math.PI / 2 * (1 - k / M)); stations.push([-(hd - e), o]); }
      const nMid = Math.ceil(2 * mid / 0.1);
      for (let j = 0; j <= nMid; j++) stations.push([-mid + 2 * mid * j / nMid, 0]);
      for (let k = 1; k <= M; k++) { const [e, o] = fil(Math.PI / 2 * k / M); stations.push([hd - e, o]); }

      const secs = stations.map(([z, o]) => section(o).map(p => new THREE.Vector3(p.x, p.y, z)));
      const n = secs[0].length, sec0 = section(0), us = [0];
      for (let i = 1; i < n; i++) us.push(us[i - 1] + sec0[i].distanceTo(sec0[i - 1])); // u = arc length (m), v = z (m)
      const pos = [], uv = [], idx = [];
      secs.forEach(sec => sec.forEach((p, i) => { pos.push(p.x, p.y, p.z); uv.push(us[i], p.z); }));
      for (let k = 0; k < secs.length - 1; k++) for (let i = 0; i < n - 1; i++) {
        const a = k * n + i, b = a + n, c = a + 1, d = b + 1;
        idx.push(a, c, b, b, c, d); // winding → outward normals
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
      geo.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
      geo.setIndex(idx);
      geo.computeVertexNormals(); // on the INDEXED grid → smooth shading across the ridge/eave/rake curves
      return geo.toNonIndexed(); // stripFlatWalls/sliceGeo work on triangle triplets
    }
    // Roof slopes are FLAT planes: the old inflated "puff" (up to 6 cm mid-slope bulge) was removed —
    // it read as a puffed roof (per user).
    const bodyGeo = roundedBodyTube();

    // SPLIT: per image3.png the long sides are FABRIC walls carrying a big mesh window — not
    // all-screen. Drop the flat side-wall quads (|x| = hwP, between the floor-corner and eave fillets)
    // from a tube and rebuild each side as a flat fabric panel with a window hole. The eave curve
    // stays with the roof, so the seam is exact.
    const sliceGeo = (src, tris) => {
      const g2 = new THREE.BufferGeometry();
      for (const name of ['position', 'normal', 'uv']) {
        const a = src.attributes[name], out = new Float32Array(tris.length * 3 * a.itemSize);
        let o = 0;
        for (const t of tris) for (let v = 0; v < 3; v++) for (let c = 0; c < a.itemSize; c++) out[o++] = a.array[(t * 3 + v) * a.itemSize + c];
        g2.setAttribute(name, new THREE.BufferAttribute(out, a.itemSize));
      }
      return g2;
    };
    function stripFlatWalls(geo, hwP, y0, y1) {
      const pos = geo.attributes.position;
      const keep = [];
      for (let t = 0; t < pos.count / 3; t++) {
        const i = t * 3;
        let flatWall = true;
        for (let k = 0; k < 3; k++) {
          const y = pos.getY(i + k);
          const xWall = hwP - y * LEAN; // leaning wall plane at this height
          if (Math.abs(pos.getX(i + k)) < xWall - 1e-3 || y < y0 - 1e-4 || y > y1 + 1e-4) flatWall = false;
        }
        if (!flatWall) keep.push(t);
      }
      return sliceGeo(geo, keep);
    }

    // Side-wall windows (per image3.png, but see-through per user): the rounded gable corners frame each
    // window, a ~24 cm fabric band runs along the bottom, and a refined rolled flap sits above it.
    // Single-walled, so you look straight through the tent from window to window.
    // body arch has a square foot, so the flat wall runs from the ground; its top is where the eave
    // fillet starts, R_EAVE back along the leaning wall
    const WALL_Y0 = 0, WALL_Y1 = WALL_H - Math.cos(LEAN_RAD) * R_EAVE;
    const WIN_HZ = hd - 0.30, WIN_Y0 = 0.24, WIN_Y1 = WALL_Y1 - 0.13, WIN_R = 0.06, WIN_RB = 0.16; // bottom corners rounder (same as Block 09, per user)
    const winYc = (WIN_Y0 + WIN_Y1) / 2, winH = WIN_Y1 - WIN_Y0;
    // flat panel in the LEANING wall plane x = ±(hwP − y·LEAN) spanning z ∈ [-hdP, hdP], y ∈ [y0, y1],
    // with the window hole. Built in (z, y) shape coords, then each vertex is placed on the plane.
    // On the +x wall the shape is MIRRORED (z = −shape x): that reverses the triangle winding so the panel's front
    // face and normals point OUTWARD. Unmirrored, the +x wall faced inward; three.js still shades a back face
    // correctly, but the shadow lookup's normalBias pushed the sample point 1 cm INTO the tent, so the sunny +x
    // wall self-shadowed and read darker than the rounded corners/eave next to it (per user). All shapes placed
    // with onWall are symmetric in z, so the mirror changes nothing else.
    const onWall = (geo, s, hwP) => {
      const p = geo.attributes.position;
      for (let i = 0; i < p.count; i++) { const z = p.getX(i), y = p.getY(i); p.setXYZ(i, s * (hwP - y * LEAN), y, s === 1 ? -z : z); }
      geo.computeVertexNormals();
      return geo;
    };
    // The panels OVERLAP the curved body by SEAM_OVERLAP at the top (into the eave curve) and, via the
    // caller's hdP, at the ends (into the rounded gable corner). Butting them edge-to-edge left
    // T-junction cracks — the panel edge is one long segment while the body has a vertex every 10 cm —
    // which rasterise as a flickering hairline down the pillar / along the eave (per user). In the
    // overlap the curve has only moved ≤ 0.4 mm inward, so the panel just covers it.
    const SEAM_OVERLAP = 0.01;
    function addWindowWalls(hwP, hdP, y0, y1, mat) {
      y1 += SEAM_OVERLAP;
      for (const s of [-1, 1]) {
        // rectangle built around the window centre (roundedRectShape is origin-centred), then lifted
        const wall = new THREE.Shape();
        wall.moveTo(-hdP, y0 - winYc); wall.lineTo(hdP, y0 - winYc);
        wall.lineTo(hdP, y1 - winYc); wall.lineTo(-hdP, y1 - winYc); wall.closePath();
        wall.holes.push(roundedRectShape2(2 * WIN_HZ, winH, WIN_R, WIN_RB));
        const wallGeo = new THREE.ShapeGeometry(wall, 8);
        wallGeo.translate(0, winYc, 0);
        const m = new THREE.Mesh(onWall(wallGeo, s, hwP), mat);
        m.castShadow = m.receiveShadow = true;
        g.add(m);
      }
    }

    const roofMesh = new THREE.Mesh(stripFlatWalls(bodyGeo, hw, WALL_Y0, WALL_Y1), matRoof);
    roofMesh.castShadow = roofMesh.receiveShadow = true;
    g.add(roofMesh);
    addWindowWalls(hw, hd - RAKE_R + SEAM_OVERLAP, WALL_Y0, WALL_Y1, matCanvas); // laps 1 cm into the rounded gable corner

    // Chimney (stove-jack) cover (per user + image3.png): a flat SQUARE fabric flap lying on the +x roof
    // slope — the slope above the side window in the photo — about two-thirds of the way back, low on
    // the slope just above the eave curve. Edges run along the eave and down the slope; a snap button
    // near its upper edge. Measured from image3.png: ≈40 cm square, lower edge ≈10 cm above the eave curve.
    {
      // 34 cm (was 40 — slightly smaller per user); CHIMNEY_UP keeps the lower edge 12 cm up the slope as before
      const CHIMNEY_SIZE = 0.34, CHIMNEY_Z = -0.50, CHIMNEY_UP = 0.12 + 0.34 / 2; // side; centre z; centre distance up the slope from the eave vertex
      const rd = new THREE.Vector3(-EAVE_X, RIDGE_H - WALL_H, 0).normalize(); // up-slope direction (+x slope)
      const rn = new THREE.Vector3(rd.y, -rd.x, 0);                          // outward roof normal
      // local basis: shape x → along the tent length, shape y → up the slope, extrusion z → roof normal
      const basis = new THREE.Matrix4().makeBasis(new THREE.Vector3(0, 0, -1), rd, rn);
      const T = 0.006;
      const coverGeo = new THREE.ExtrudeGeometry(roundedRectShape(CHIMNEY_SIZE, CHIMNEY_SIZE, 0.02),
        { depth: T - 0.002, bevelEnabled: true, bevelThickness: 0.001, bevelSize: 0.003, bevelSegments: 2 });
      coverGeo.applyMatrix4(basis);
      const centre = new THREE.Vector3(EAVE_X, WALL_H, CHIMNEY_Z).addScaledVector(rd, CHIMNEY_UP).addScaledVector(rn, 0.002);
      const cover = new THREE.Mesh(coverGeo, matCanvas); // same fabric as every other panel
      cover.position.copy(centre);
      cover.castShadow = cover.receiveShadow = true;     // the thin shadow line under its edge outlines it
      g.add(cover);
      const snap = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.012, 0.005, 16), matTrim);
      snap.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), rn);
      snap.position.copy(centre).addScaledVector(rd, CHIMNEY_SIZE / 2 - 0.05).addScaledVector(rn, T + 0.002);
      g.add(snap);
    }

    for (const s of [-1, 1]) {
      // fine see-through screen (same as the gable door): overlaps the hole edge by 1 cm and sits
      // 1 cm inside the wall plane
      const winGeo = new THREE.ShapeGeometry(roundedRectShape2(2 * WIN_HZ + 0.02, winH + 0.02, WIN_R + 0.01, WIN_RB + 0.01), 8);
      winGeo.translate(0, winYc, 0);
      const win = new THREE.Mesh(onWall(winGeo, s, hw - 0.01), matGableMesh);
      win.renderOrder = 9; // drawn before the gable screen (10)
      win.castShadow = true; win.customDepthMaterial = matScreenShadow; // ~50% sun through the mesh
      g.add(win);

      if (s === 1 && OPTS.docked) continue; // GENERATED: +x side docked to Block 05 — no storm flap
      // rolled storm flap (refined, same treatment as the door flap): a gathered roll resting on the wall
      // right above the window, overlapping the screen's top edge so it reads as attached, with ends
      // tapering shut. Two webbing straps hold it up, each with a short tail hanging over the screen (per
      // image3.png). It used to be half-sunk into the wall, which (the wall being zero-thickness) poked
      // 2.75 cm of roll through into the interior — now it rests fully outside.
      const rollR = 0.05, rollY = WIN_Y1 + rollR * 0.55, rollX = s * (hw - rollY * LEAN + rollR + 0.003);
      const flap = new THREE.Mesh(makeTube([
        new THREE.Vector3(rollX, rollY, -WIN_HZ - 0.02),
        new THREE.Vector3(rollX, rollY, WIN_HZ + 0.02),
      ], rollR, 0.18, 20, 0.12), matCanvas);
      flap.castShadow = flap.receiveShadow = true;
      g.add(flap);
      for (const zs of [-1, 1]) {
        const z = zs * WIN_HZ * 0.55;
        // ring in XY → wraps the z-axis roll; open (1.6 rad) where the roll touches the wall, gap centred on
        // the wall direction (−s·x, tilted by the lean), so it can't poke through to the inside
        const STRAP_GAP = 1.6;
        const strap = new THREE.Mesh(new THREE.TorusGeometry(rollR * 1.14, 0.005, 6, 28, Math.PI * 2 - STRAP_GAP), matTrim);
        strap.rotation.z = (s === 1 ? Math.PI : 0) + s * LEAN_RAD + STRAP_GAP / 2; // wall dir: π+lean (right), −lean (left)
        strap.position.set(rollX, rollY, z);
        g.add(strap);
        const tail = new THREE.Mesh(new THREE.BoxGeometry(0.003, 0.04, 0.02), matTrim); // short tail (per user)
        const tailY = rollY - rollR - 0.015;
        tail.position.set(s * (hw - tailY * LEAN + 0.004), tailY, z);
        tail.rotation.z = s * LEAN_RAD; // hangs flat against the leaning wall
        g.add(tail);
      }
    }

    // SINGLE-WALL interior (per user): the old inner liner shell 5 cm inside the fly (+ its window
    // sleeves and inner back wall) was removed — it hid the bathtub wall behind a dark rounded edge and
    // made the side walls read ~6 cm thick at the windows and corners. From inside you now see the
    // tent's own fabric (DoubleSide) with the PVC tub wall running round its base.

    // Interior AIR FRAME (per user): light-grey inflated beams, all Ø14 cm and all joined together.
    //  - An arch at each end: the two corner pillars stand on the floor tucked into the rounded corners,
    //    rise with the side walls' lean, turn at the eaves and run up under the roof to meet at the ridge
    //    — one continuous tube. Its centreline is the silhouette offset in by FRAME_B, so it hugs wall,
    //    eave and roof.
    //  - The ridge beam runs between the two arch crowns, at exactly their height, so its ends sink into
    //    the arches. Two side-wall beams do the same at the eaves (below).
    const POLE_R = 0.07, FRAME_B = 0.09; // beam radius; centreline inset from wall/roof and from each gable face
    const frameArch = archPts(FRAME_B, 0.002, 12, POLE_R * 1.3);
    const crownY = Math.max(...frameArch.map(p => p.y)); // arch centreline height at the ridge
    const FRAME_Z = hd - FRAME_B;
    for (const sz of [-1, 1]) {
      const arch = new THREE.Mesh(makeTube(frameArch.map(p => new THREE.Vector3(p.x, p.y, sz * FRAME_Z)), POLE_R, 0, 24), matPole);
      arch.castShadow = false; arch.receiveShadow = true;
      g.add(arch);
    }
    const pole = new THREE.Mesh(new THREE.CylinderGeometry(POLE_R, POLE_R, 2 * FRAME_Z, 24), matPole);
    pole.rotation.x = Math.PI / 2; // cylinder Y-axis → Z (tent length)
    pole.position.y = crownY;      // centred on the arch crowns → ends sink into both arches
    pole.castShadow = false; pole.receiveShadow = true;
    g.add(pole);
      // ---- camping lantern (per user; same model as block05.html) hanging from the middle of the bare ridge beam,
      //      window turned to face the front door (+z).
      //      Black cap with a torch lens on top + power button, M-shaped wire bail, champagne-metal body with a
      //      window onto a warm glowing filament tube, ribbed black rubber base. ≈ 17 cm body + bail, Ø ≈ 6 cm.
      //      The tent's interior light source lives inside its glow tube.
      {
        const lamp = new THREE.Group();
        const matBlack = new THREE.MeshStandardMaterial({ color: 0x1b1c1e, roughness: 0.55 });
        const matBody = new THREE.MeshStandardMaterial({ color: 0x8f877b, roughness: 0.32, metalness: 0.75 });
        const matSteel = new THREE.MeshStandardMaterial({ color: 0xc9cbce, roughness: 0.3, metalness: 0.85 });
        const matInner = new THREE.MeshStandardMaterial({ color: 0x2a2724, roughness: 0.8 });
        const matGlow = new THREE.MeshStandardMaterial({ color: 0xffa050, emissive: 0xff7a18, emissiveIntensity: 1.6, roughness: 0.4 }); // warm amber (2.2 / 0xffa040 tone-mapped to yellow-green)
        const matLens = new THREE.MeshStandardMaterial({ color: 0xe8eef2, emissive: 0xcfd8de, emissiveIntensity: 0.35, roughness: 0.1, metalness: 0.2 });
        const matGlass = new THREE.MeshStandardMaterial({ color: 0x9aa3a8, roughness: 0.05, metalness: 0.1, transparent: true, opacity: 0.18, depthWrite: false });
        const add = (geo, mat, y = 0) => { const m = new THREE.Mesh(geo, mat); m.position.y = y; lamp.add(m); return m; };
        const R = 0.029, WIN = Math.PI * 0.42;                // body radius; window opening angle (faces +x)
        // base: ribbed black rubber foot (notched rim) + a thin dark seam ring
        add(new THREE.CylinderGeometry(R + 0.002, R + 0.003, 0.026, 24), matBlack, 0.013);
        for (let k = 0; k < 12; k++) {
          const a = k / 12 * Math.PI * 2, rib = add(new THREE.BoxGeometry(0.006, 0.012, 0.004), matBlack, 0.006);
          rib.position.set(Math.cos(a) * (R + 0.003), 0.006, Math.sin(a) * (R + 0.003)); rib.rotation.y = -a;
        }
        add(new THREE.TorusGeometry(R + 0.0005, 0.0015, 6, 32), matSteel, 0.027).rotation.x = Math.PI / 2;
        // body: metal shell with a front window, dark interior, glow tube with a silver top segment, glass
        const BH = 0.10, BY = 0.027 + BH / 2;
        // (three.js cylinder θ is measured from +z, so +x is θ = π/2 — the opening is centred there, facing the door)
        add(new THREE.CylinderGeometry(R, R, BH, 32, 1, true, Math.PI / 2 + WIN / 2, Math.PI * 2 - WIN), matBody, BY).material.side = THREE.DoubleSide;
        // dark inner lining — open at the window (a closed cylinder here swallowed the glow tube)
        add(new THREE.CylinderGeometry(R - 0.004, R - 0.004, BH, 24, 1, true, Math.PI / 2 + WIN / 2, Math.PI * 2 - WIN), matInner, BY).material.side = THREE.DoubleSide;
        add(new THREE.CylinderGeometry(0.0055, 0.0055, 0.058, 16), matGlow, BY - 0.012).position.x = R - 0.012;
        add(new THREE.CylinderGeometry(0.0075, 0.0075, 0.03, 16), matSteel, BY + 0.033).position.x = R - 0.012;
        add(new THREE.CylinderGeometry(R + 0.0006, R + 0.0006, BH - 0.012, 24, 1, true, -WIN / 2 + Math.PI / 2, WIN), matGlass, BY);
        // cap: black, tapering in to the top lens; power button facing the window side
        const CY = 0.027 + BH;
        add(new THREE.CylinderGeometry(R - 0.004, R + 0.002, 0.045, 32), matBlack, CY + 0.0225);
        add(new THREE.CylinderGeometry(0.014, 0.014, 0.004, 24), matLens, CY + 0.046);
        add(new THREE.TorusGeometry(0.0145, 0.0018, 6, 24), matSteel, CY + 0.046).rotation.x = Math.PI / 2;
        const btn = add(new THREE.CylinderGeometry(0.007, 0.007, 0.004, 20), new THREE.MeshStandardMaterial({ color: 0x5a5d61, roughness: 0.4 }), CY + 0.018);
        btn.rotation.z = Math.PI / 2; btn.position.x = R + 0.001;
        // wire bail: M-shaped, pivoting on the cap sides (bail plane along z = along the beam)
        const bY = CY + 0.03, bail = [[-1, 0], [-1.08, 0.035], [-0.42, 0.068], [0, 0.058], [0.42, 0.068], [1.08, 0.035], [1, 0]]
          .map(([z, y]) => new THREE.Vector3(0, bY + y, z * (R + 0.004)));
        lamp.add(new THREE.Mesh(makeTube(bail, 0.0018, 0, 8), matSteel));
        for (const sz of [-1, 1]) add(new THREE.SphereGeometry(0.004, 10, 8), matSteel, bY).position.z = sz * (R + 0.004);
        // hang: S-hook from a ring round the beam down to the bail's centre dip
        const ringR = POLE_R + 0.006, hangY = crownY - ringR, dipY = bY + 0.058;
        const ring = new THREE.Mesh(new THREE.TorusGeometry(ringR, 0.0025, 8, 40), matSteel); // axis z = the ridge beam
        ring.position.set(0, crownY, 0);
        g.add(ring);
        const HOOK = 0.035;
        const hook = new THREE.Mesh(new THREE.CylinderGeometry(0.002, 0.002, HOOK, 8), matSteel);
        hook.position.set(0, hangY - HOOK / 2, 0);
        g.add(hook);
        lamp.position.set(0, hangY - HOOK - dipY, 0);
        lamp.rotation.y = -Math.PI / 2;                  // window (+x in lamp space) → faces the door (+z); bail turns across the beam
        lamp.traverse(o => { if (o.isMesh) o.castShadow = o.receiveShadow = false; });
        g.add(lamp);
        // the tent's interior light (replaces the old free-floating innerLight), at the glow tube. A downward SPOT
        // cone (≈ 81° half-angle, soft edge) rather than a point light: the lantern's solid cap stops light going
        // straight up, so the bare ridge beam it hangs from isn't blown out white (it was with a point light). No
        // shadow casting — the page's ShadowMaterial ground would pick up the lantern's shadows and go grey.
        const light = new THREE.SpotLight(0xffd9a8, 1.1, 7, Math.PI * 0.45, 0.7, 1.8);
        light.position.set(R - 0.012, BY - 0.012, 0);
        light.target.position.set(R - 0.012, BY - 1, 0);
        lamp.add(light, light.target);
        g.userData.lantern = light; g.userData.lanternGlow = matGlow; // GENERATED
      }
    //  - Side-wall beams (per user): one along each side wall at the eave, running front arch → back arch.
    //    Centred on the arch's eave knee (the midpoint of its eave bend), so both ends sink into the arches.
    const knee = frameArch[1 + 6]; // archPts: [foot, eave start, 12 eave-bend points …] → t = 0.5 of the bend
    for (const sx of [-1, 1]) {
      const beam = new THREE.Mesh(new THREE.CylinderGeometry(POLE_R, POLE_R, 2 * FRAME_Z, 24), matPole);
      beam.rotation.x = Math.PI / 2;
      beam.position.set(sx * knee.x, knee.y, 0);
      beam.castShadow = false; beam.receiveShadow = true;
      g.add(beam);
    }
    //  - Fabric SLEEVES (per user): the frame's runs are wrapped in tent fabric; bare light-grey tube shows
    //    only at the ridge beam (fully bare), the bottom SLEEVE_Y0 of each pillar, and every JUNCTION —
    //    each junction left bare for JOINT_BARE (≥ 25 cm, per user) along every member from its centre:
    //      eave elbow (centre = the arch's eave knee, where the side beam plugs in): pillar, rafter, side beam
    //      crown (centre = arch apex, where the ridge beam plugs in): both rafters
    //    Sleeves are slightly looser than the tube, softly rumpled, with cuffs tapering in onto the beam.
    {
      const SLEEVE_R = POLE_R + 0.012; // < the arch's 1.3·POLE_R minimum bend radius → no pinching at the bends
      const SLEEVE_Y0 = 0.45, JOINT_BARE = 0.25; // pillar sleeves start 45 cm up (was 30 — shortened 15 cm per user)
      const addSleeve = pts => {
        const sleeve = new THREE.Mesh(makeTube(pts, SLEEVE_R, 0.05, 24, 0.03), matCanvas);
        sleeve.castShadow = false; sleeve.receiveShadow = true;
        g.add(sleeve);
      };
      // arc length along the arch polyline, and the sub-polyline between two arc lengths
      const cum = [0];
      for (let i = 1; i < frameArch.length; i++) cum.push(cum[i - 1] + frameArch[i].distanceTo(frameArch[i - 1]));
      const pointAt = s => {
        let i = 1;
        while (i < cum.length - 1 && cum[i] < s) i++;
        return frameArch[i - 1].clone().lerp(frameArch[i], (s - cum[i - 1]) / (cum[i] - cum[i - 1]));
      };
      const subPath = (s0, s1) => [pointAt(s0), ...frameArch.filter((p, i) => cum[i] > s0 && cum[i] < s1), pointAt(s1)];
      const L = cum[cum.length - 1];
      const foot = frameArch[0], eS = frameArch[1];
      const sFoot = (SLEEVE_Y0 - foot.y) / (eS.y - foot.y) * cum[1]; // pillar sleeve starts SLEEVE_Y0 above the floor
      const sKnee = cum[7], sCrown = L / 2;                           // knee = eave-bend midpoint (archPts index 7)
      const bare = JOINT_BARE;
      const runs = [
        [sFoot, sKnee - bare],               // right pillar
        [sKnee + bare, sCrown - bare],       // right rafter
        [sCrown + bare, L - sKnee - bare],   // left rafter
        [L - sKnee + bare, L - sFoot],       // left pillar
      ];
      for (const sz of [-1, 1]) for (const [s0, s1] of runs)
        addSleeve(subPath(s0, s1).map(p => new THREE.Vector3(p.x, p.y, sz * FRAME_Z)));
      // side eave beams: bare JOINT_BARE from each arch centreline
      const zS = FRAME_Z - bare;
      for (const sx of [-1, 1])
        addSleeve([new THREE.Vector3(sx * knee.x, knee.y, -zS), new THREE.Vector3(sx * knee.x, knee.y, zS)]);
    }

    // Bathtub floor (500D PVC, per user): ONE continuous sheet covering the whole tent footprint, turning
    // up in a soft bend into a 10 cm tub wall that runs flush against the INSIDE of the tent walls —

    {
      const N = 480;
      // inset from the outer footprint to the inside of the tent skin: 4 mm on the side walls,

      const skin = (nx, nz) => 0.004 * Math.abs(nx) + 0.016 * Math.abs(nz);
      const tubOff = (y, extra = 0) => (u, nx, nz) => -(skin(nx, nz) + extra + y * LEAN * Math.abs(nx)); // follows the lean

        footprintLoop(hw, hd, RAKE_R, N, tubOff(0, 0.035), () => 0.002),   // floor, 3.5 cm in from the wall
        footprintLoop(hw, hd, RAKE_R, N, tubOff(0, 0.012), () => 0.005),   // soft bend: floor → wall

    }

    if (OPTS.bed !== false) { // GENERATED: o.bed === false → no bed (that Block 10 has the sofa)
    // Inflatable air bed (per user, after the Naturehike Horizon air mattress): 200 × 180 × 38 cm.
    // Glossy taupe PVC sides built as three stacked rounded bands (two grooves); a cream flocked top with
    // a thick rolled rim and a quilted field of tufted dimples; built-in pump panel + valve near one
    // corner of the foot end; two pillows at the head. Placed with its length along z, head against the
    // closed back gable, centred across the width — leaving ~75 cm of floor inside the door.
    {
      const BED_W = 1.80, BED_L = 2.00, BED_H = 0.38, BED_R = 0.15; // plan corner radius
      const bed = new THREE.Group();
      bed.name = 'bed';
      bed.position.set(0, 0.004, -(hd - 0.035) + BED_L / 2); // head 3.5 cm off the back gable
      g.add(bed);
      const matBedSide = new THREE.MeshPhysicalMaterial({ color: 0x8b7560, roughness: 0.35, clearcoat: 0.5, clearcoatRoughness: 0.3, side: THREE.DoubleSide });
      const matBedTop = new THREE.MeshStandardMaterial({ color: 0xe8e2d4, roughness: 0.95, side: THREE.DoubleSide }); // flocked
      const hx = BED_W / 2, hz = BED_L / 2, N = 360;
      const loop = (off, y) => footprintLoop(hx, hz, BED_R, N, () => off, () => y);

      // side wall: three rounded bands — offset dips GROOVE at each band boundary; bottom rolls under
      const SIDE_TOP = BED_H - 0.035, BAND = SIDE_TOP / 3, GROOVE = 0.012;
      const sideLoops = [];
      for (let k = 0; k <= 30; k++) {

      const rim = new THREE.Mesh(loftLoops([
        loop(-GROOVE, SIDE_TOP), loop(-0.004, BED_H - 0.018), loop(-0.018, BED_H - 0.004),
        loop(-0.045, BED_H), loop(-0.075, BED_H - 0.002), loop(-0.10, BED_H - 0.009), loop(-FIELD_IN, FIELD_Y),
      ]), matBedTop);
      rim.castShadow = false; rim.receiveShadow = true; // casting from this curved DoubleSide rim gave shadow acne; the side casts the bed's shadow
      bed.add(rim);

      // quilted field: a grid clamped to the rim's inner rounded rectangle; puffy cells between tuft
      // dimples on a ~20 cm pitch, fading flat at the edge to meet the rim
      const fx = hx - FIELD_IN, fz = hz - FIELD_IN, fr = BED_R - FIELD_IN, PITCH = 0.2;
      const field = new THREE.PlaneGeometry(2 * fx, 2 * fz, Math.ceil(2 * fx / 0.015), Math.ceil(2 * fz / 0.015));
      field.rotateX(-Math.PI / 2);
      const fp = field.attributes.position;
      for (let i = 0; i < fp.count; i++) {
        let x = fp.getX(i), z = fp.getZ(i);
        const cx = fx - fr, cz = fz - fr; // clamp the rectangle's corners onto the rounded corner arcs
        if (Math.abs(x) > cx && Math.abs(z) > cz) {
          const dx = Math.abs(x) - cx, dz = Math.abs(z) - cz, d = Math.hypot(dx, dz);
          if (d > fr) { x = Math.sign(x) * (cx + dx / d * fr); z = Math.sign(z) * (cz + dz / d * fr); }
        }
        const gx = x - PITCH * Math.round(x / PITCH), gz = z - PITCH * Math.round(z / PITCH); // offset to nearest tuft
        const puff = 1 - Math.exp(-(gx * gx + gz * gz) / (0.045 * 0.045));
        const edge = Math.min(fx - Math.abs(x), fz - Math.abs(z)), fade = THREE.MathUtils.smoothstep(edge, 0, 0.06);
        fp.setXYZ(i, x, FIELD_Y - 0.004 + 0.016 * puff * fade, z); // tufts dip below the rim-join level, cells puff above
      }

      bed.add(fieldMesh);

      // built-in pump panel + inflation valve on the foot end (+z, facing the door), near one corner

      const pump = new THREE.Mesh(new THREE.BoxGeometry(0.075, 0.05, 0.012), new THREE.MeshStandardMaterial({ color: 0xd9cdb8, roughness: 0.6 }));
      pump.position.set(-hx + 0.30, pumpY, hz + 0.004);

      valve.rotation.x = Math.PI / 2;

      const PW = 0.62, PD = 0.40, PH = 0.15;

    }

    }

    // Gable ends: the body's rounded rake/corner edge wraps onto each end; the flat gable panels sit
    // inside it at the rim plane (z = ±hd), whose outline is the silhouette inset by RAKE_R. (The old

    const FACING_D = 0.012;             // gable panel thickness (1.2 cm)
    // The gable panels' outline reaches 4 mm PAST the rounded edge's end loop, so the panel's side face
    // buries itself in the fillet. Stopping exactly at (or 1 mm short of) the edge left a visible

      mesh.renderOrder = 10;
      g.add(mesh);
      // double-door split line — from the sill up to just under the rolled flap, so it never

      const seamTop = RIDGE_H - FRAME_W - 0.05, seamH = seamTop - DOOR_SILL;
      const seam = new THREE.Mesh(new THREE.BoxGeometry(0.01, seamH, 0.004), matTrim); // zip tape, not a black bar
      seam.position.set(0, DOOR_SILL + seamH / 2, hd - FACING_D / 2 + 0.003); // just in front of the screen, inside the opening
      g.add(seam);

      // rolled-up door flaps (per image3.png): bunched rolls sitting on the flat panel
      // along the top edge of the opening — half sunk into the panel, overlapping the screen's top edge
      // so it reads as attached — running left eave → ridge → right eave and only just turning down
      // past the eaves. Ends taper shut into the panel instead of hanging as open pipes.
      const rollR = 0.04, rollZ = hd + rollR * 0.15;   // slimmer roll (was 0.065 — per user), just proud of the panel face
      const rollB = FRAME_W - rollR * 0.25;            // centreline just above the opening's top edge
      const rollPts = archPts(rollB, WALL_H - R_EAVE - 0.14, 12, rollR * 1.2).map(p => new THREE.Vector3(p.x, p.y, rollZ));
      // double door (per user): the LEFT and RIGHT door halves each roll up separately — two rolls that
      // meet at the zip line under the ridge with a small gap, each tapering shut at both ends
      const ZIP_GAP = 0.02; // half-gap either side of the centre zip
      for (const side of [1, -1]) {
        const half = rollPts.filter(p => side * p.x > ZIP_GAP);
        const roll = new THREE.Mesh(makeTube(half, rollR, 0.14, 20, 0.10), matCanvas);
        roll.castShadow = true; roll.receiveShadow = true;
        g.add(roll);
      }

      // tie ropes (per user / image3.png): two per roof slope. Each is a thin rope loop wrapped round
      // the roll (ring perpendicular to the roll's path) plus a short rope hanging straight down in
      // front of the screen, finished with a small knot.
      const rollPath = new THREE.CurvePath();
      for (let i = 1; i < rollPts.length; i++) rollPath.add(new THREE.LineCurve3(rollPts[i - 1], rollPts[i]));
      // 2 ties per door-half flap (per user: max 2 each), short tails
      const ROPE_R = 0.004, TAIL = 0.05;
      for (const u of [0.18, 0.36, 0.64, 0.82]) { // fractions of the arch; 0.18/0.36 on one half's roll, 0.64/0.82 on the other's
        const p = rollPath.getPointAt(u), t = rollPath.getTangentAt(u).normalize();
        const loop = new THREE.Mesh(new THREE.TorusGeometry(rollR * 1.12, ROPE_R, 6, 28), matTrim);
        loop.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), t); // torus axis along the roll
        loop.position.copy(p);
        g.add(loop);
        const tail = new THREE.Mesh(new THREE.CylinderGeometry(ROPE_R, ROPE_R, TAIL, 6), matTrim);
        tail.position.set(p.x, p.y - rollR - TAIL / 2 + 0.01, p.z + 0.004); // hangs from the loop, just in front of the screen
        g.add(tail);
        const knot = new THREE.Mesh(new THREE.SphereGeometry(ROPE_R * 2.2, 8, 6), matTrim);
        knot.position.set(p.x, p.y - rollR - TAIL + 0.01, p.z + 0.004);
        g.add(knot);
      }
    }

    // snow skirt (per image3.png): a thin fabric band sewn to the base of the walls that drapes
    // outward onto the ground in soft, uneven folds — not a rigid plinth. Four loops, all generated
    // from the same footprint parametrisation so they stitch vertex-for-vertex:
    //   seam exactly on the wall face → tangential peel-off → belly → hem lying on the ground.
    // Same material as the walls + a tangential start = no visible join (per user: seamless).
    // One shared fold signal drives all loops, so every fold runs from seam to hem like real drape.
    {
      const fold = u => 0.5 * Math.sin(u / 0.42 * Math.PI * 2) + 0.3 * Math.sin(u / 0.23 * Math.PI * 2 + 1.7)
                      + 0.2 * Math.sin(u / 0.71 * Math.PI * 2 + 0.4);
      // short skirt (per user, shortened twice): seam 5 cm up (was 13 → 8), hem reaching ~4.5 cm out
      const N = 560, Y_SEAM = 0.05;
      const lean = (y, nx) => -y * LEAN * Math.abs(nx);
      const skirt = new THREE.Mesh(loftLoops([
        // offsets are relative to the ground footprint; on the leaning ±x sides the wall surface at height
        // y is y·LEAN further in, so `lean(y, nx)` pulls each loop back by that (|nx| blends round the corners)
        footprintLoop(hw, hd, RAKE_R, N, (u, nx) => lean(Y_SEAM, nx), () => Y_SEAM),                   // seam exactly ON the wall surface
        footprintLoop(hw, hd, RAKE_R, N, (u, nx) => 0.003 + lean(Y_SEAM - 0.014, nx), () => Y_SEAM - 0.014), // peels off tangentially — no ledge/step
        footprintLoop(hw, hd, RAKE_R, N, (u, nx) => 0.02 + 0.005 * fold(u) + lean(0.018, nx), () => 0.018),
        footprintLoop(hw, hd, RAKE_R, N, u => 0.045 + 0.012 * fold(u), u => 0.003 + 0.006 * Math.max(0, fold(u))),
      ]), matCanvas);
      skirt.castShadow = false; skirt.receiveShadow = true;
      cutTris(skirt, (cx, cz) => // GENERATED: no snow skirt where tents meet
        (OPTS.docked && cx > hw - 0.12 && Math.abs(cz) < 1.22) ||      // Block 05's 240 cm docking face
        (OPTS.openBack && cz < -(hd - 0.12) && Math.abs(cx) < 1.62) ||  // gable joint behind
        (OPTS.openFront && cz > hd - 0.12 && Math.abs(cx) < 1.62));     // gable joint in front
      g.add(skirt);
    }

    g.position.x = cx;
    return g;
  }


  return (o = {}) => {
    OPTS = o;
    const tent = buildTent(0, -1);
    Object.assign(tent.userData, { archPts, makeTube, matCanvas, matTrim, matGableMesh });
    return tent;
  };
})();

const makeBlock09 = (() => {
